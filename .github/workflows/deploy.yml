name: Deploy

# Staging deploys on every push to main. Production NEVER deploys automatically:
# it runs only when this workflow is dispatched manually, which is the approval
# step. GitHub's own required-reviewers rule would be the natural way to express
# that, but on a private repo it needs Enterprise ("If you are on a GitHub Free,
# GitHub Pro, or GitHub Team plan, required reviewers are only available for
# public repositories"), so the manual trigger stands in for the approval button.
# The production environment additionally accepts deployments only from
# protected branches, so prod can never be shipped from a feature branch.
#
# To release: merge to main, check staging, then run this workflow from the
# Actions tab (or `gh workflow run deploy.yml --ref main`).
#
# Each GitHub environment (staging, production) must define:
#   vars:    AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
#            AZURE_RG, ACR_NAME, WEBAPP_NAME, KEYVAULT_NAME,
#            JOBS_SUBNET_ID, JOBS_IDENTITY_ID
#   secrets: SWA_DEPLOY_TOKEN
# Values come from the Bicep deployment outputs — see infra/README.md.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_ci_gate:
        description: >-
          Emergency only: deploy without a green CI run for this commit. Needed
          when rolling back to a commit whose CI run has aged out of retention,
          since the gate cannot tell "never tested" from "logs expired".
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read
  actions: read # ci-gate reads the CI run's conclusion

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Deploy is triggered by the same push as CI, so without this it races ahead
  # and can ship a commit whose tests failed. `main` now has a required status
  # check, so a red PR cannot merge — but that does not cover a manual dispatch
  # or an admin bypass, and this is the only gate in front of production. It
  # fails CLOSED: no CI run, a red run, or a timeout all stop the deploy.
  # Manual runs are gated too (production is dispatch-only, so exempting them
  # would exempt every production deploy); `skip_ci_gate` is the escape hatch.
  ci-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Require CI to have passed for this commit
        if: ${{ !inputs.skip_ci_gate }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 90); do   # ~15 min ceiling
            read -r status conclusion < <(gh api \
              "/repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${{ github.sha }}&per_page=1" \
              --jq '((.workflow_runs[0].status // "queued") + " " + (.workflow_runs[0].conclusion // "none"))')
            echo "attempt $attempt: CI status=$status conclusion=$conclusion"
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "CI passed for ${{ github.sha }} — proceeding."
                exit 0
              fi
              echo "::error::CI concluded '$conclusion' for ${{ github.sha }} — refusing to deploy."
              exit 1
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for CI on ${{ github.sha }} — refusing to deploy."
          exit 1

  staging:
    runs-on: ubuntu-latest
    needs: ci-gate
    # A merge to main lands on staging; a manual dispatch is a production
    # release, and staging already has that commit.
    if: github.event_name == 'push'
    environment: staging
    env:
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Server-side builds: no docker daemon needed, auth is implicit.
      - name: Build + push API image
        run: |
          az acr build --registry "$ACR_NAME" \
            --image "jumpstart-api:$TAG" \
            --target runtime \
            --file apps/api/Dockerfile .
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}

      - name: Build + push migration image
        run: |
          az acr build --registry "$ACR_NAME" \
            --image "jumpstart-migrate:$TAG" \
            --target migrate \
            --file apps/api/Dockerfile .
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}

      - name: Run database migrations (one-off container in the VNet)
        run: bash .github/scripts/run-migration-job.sh
        env:
          AZURE_RG: ${{ vars.AZURE_RG }}
          ACR_NAME: ${{ vars.ACR_NAME }}
          KEYVAULT_NAME: ${{ vars.KEYVAULT_NAME }}
          JOBS_SUBNET_ID: ${{ vars.JOBS_SUBNET_ID }}
          JOBS_IDENTITY_ID: ${{ vars.JOBS_IDENTITY_ID }}
          IMAGE_TAG: ${{ github.sha }}
          JOB_NAME: migrate-${{ github.run_number }}

      - name: Deploy API container
        run: |
          az webapp config container set \
            --resource-group "${{ vars.AZURE_RG }}" \
            --name "${{ vars.WEBAPP_NAME }}" \
            --container-image-name "${{ vars.ACR_NAME }}.azurecr.io/jumpstart-api:$TAG"

      # Linking the App Service as the SWA backend enables Easy Auth on it, so
      # the *.azurewebsites.net host always answers 401 — health is only
      # observable through the SWA front door, after the SPA deploy below.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Build web
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @jumpstart/shared build
          pnpm --filter @jumpstart/web build

      - name: Deploy SPA to Static Web Apps
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOY_TOKEN }}
          action: upload
          app_location: apps/web/dist
          skip_app_build: true

      - name: Wait for API health through the SWA front door
        run: |
          host=$(az staticwebapp show -g "${{ vars.AZURE_RG }}" \
            -n "$(az staticwebapp list -g "${{ vars.AZURE_RG }}" --query '[0].name' -o tsv)" \
            --query defaultHostname -o tsv)
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 10 \
              "https://$host/api/health" || true)
            [ "$code" = "200" ] && echo "healthy" && exit 0
            sleep 5
          done
          echo "SWA->API proxy did not become healthy (last: $code)" && exit 1

  production:
    runs-on: ubuntu-latest
    needs: ci-gate
    # Dispatch-only: this `if` IS the approval gate. The job is self-contained
    # (it builds its own images and runs its own migrations), so it does not
    # need the staging job — only a green CI run for the commit.
    if: github.event_name == 'workflow_dispatch'
    environment: production
    env:
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build + push API image
        run: |
          az acr build --registry "$ACR_NAME" \
            --image "jumpstart-api:$TAG" \
            --target runtime \
            --file apps/api/Dockerfile .
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}

      - name: Build + push migration image
        run: |
          az acr build --registry "$ACR_NAME" \
            --image "jumpstart-migrate:$TAG" \
            --target migrate \
            --file apps/api/Dockerfile .
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}

      - name: Run database migrations (one-off container in the VNet)
        run: bash .github/scripts/run-migration-job.sh
        env:
          AZURE_RG: ${{ vars.AZURE_RG }}
          ACR_NAME: ${{ vars.ACR_NAME }}
          KEYVAULT_NAME: ${{ vars.KEYVAULT_NAME }}
          JOBS_SUBNET_ID: ${{ vars.JOBS_SUBNET_ID }}
          JOBS_IDENTITY_ID: ${{ vars.JOBS_IDENTITY_ID }}
          IMAGE_TAG: ${{ github.sha }}
          JOB_NAME: migrate-prod-${{ github.run_number }}

      - name: Deploy API container to the staging slot
        run: |
          az webapp config container set \
            --resource-group "${{ vars.AZURE_RG }}" \
            --name "${{ vars.WEBAPP_NAME }}" \
            --slot staging \
            --container-image-name "${{ vars.ACR_NAME }}.azurecr.io/jumpstart-api:$TAG"

      - name: Wait for slot health
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 5 \
              "https://${{ vars.WEBAPP_NAME }}-staging.azurewebsites.net/api/health" || true)
            [ "$code" = "200" ] && echo "healthy" && exit 0
            sleep 5
          done
          echo "Slot did not become healthy" && exit 1

      - name: Swap slot into production
        run: |
          az webapp deployment slot swap \
            --resource-group "${{ vars.AZURE_RG }}" \
            --name "${{ vars.WEBAPP_NAME }}" \
            --slot staging \
            --target-slot production

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Build web
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @jumpstart/shared build
          pnpm --filter @jumpstart/web build

      - name: Deploy SPA to Static Web Apps
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOY_TOKEN }}
          action: upload
          app_location: apps/web/dist
          skip_app_build: true
